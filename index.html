<body>
<div class="app" id="app">
  <section class="page-col">
    <header class="topbar">
      <button class="icon-btn" id="menu" aria-label="Course contents" title="Course contents"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <button class="note-btn" id="noteBtn" title="Write a note about this page (select text first to quote it)">Note</button>
      <button class="icon-btn" id="theme" aria-label="Switch between light and dark" title="Light / dark"></button>
    </header>
    <div class="page-scroll" id="scroll"><article id="view" class="view"></article></div>
  </section>
  <div class="split" id="split" title="Drag to resize"></div>
  <section class="bench" id="bench">
    <header class="bench-h">
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="machines" role="tab">Machines</button>
        <button class="tab" data-tab="code" role="tab">Code <span id="codeName"></span></button>
      </div>
      <div class="bench-tools" id="machineTools">
        <span class="lbl">Wire</span>
        <div class="seg" id="speed"><button data-s="0" class="on" title="Packets cross as fast as the browser allows">fast</button><button data-s="4" title="A few hundred packets per second: you can watch the buffers">slow</button><button data-s="150" title="A few packets per second: you can read each one">crawl</button></div>

    <div class="pane on" id="pane-machines">

        <div class="term" id="termA"></div>

      </div>
    </div>
    <div class="pane" id="pane-code">
      <div class="code-bar">
        <button class="btn primary sm" id="build" title="Ctrl+Enter">Build</button>

        <span class="build-status" id="buildStatus">Not built yet</span>
        <span class="sp"></span>
        <button class="btn sm ghost" id="resetCode" title="Throw away your changes and start again from the given code">Start over</button>
